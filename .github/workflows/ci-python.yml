name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "py-mcp-servers/**"
      - "python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "py-mcp-servers/**"
      - "python/**"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Python packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect packages with pyproject.toml or setup.py
        id: detect
        run: |
          packages=()
          for dir in py-mcp-servers/* python/*; do
            if [ -d "$dir" ] && [ "$dir" != "py-mcp-servers/__pycache__" ]; then
              if [ -f "$dir/pyproject.toml" ] || [ -f "$dir/setup.py" ] || [ -f "$dir/setup.cfg" ]; then
                relpath="${dir#./}"
                packages+=("$relpath")
              fi
            fi
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "packages=" >> "$GITHUB_OUTPUT"
          else
            # Convert bash array to JSON array
            printf '%s\n' "${packages[@]}" | jq -R . | jq -s -c . > /tmp/pkgs.json
            pkgs=$(cat /tmp/pkgs.json)
            echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff and mypy
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff check
        working-directory: py-mcp-servers
        run: ruff check .

      - name: Run ruff format check
        working-directory: py-mcp-servers
        run: ruff format --check .

      - name: Run mypy
        working-directory: py-mcp-servers
        continue-on-error: true
        run: mypy .

  test:
    name: Test
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest and coverage tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install package in editable mode
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f "pyproject.toml" ]; then
            pip install -e .
          elif [ -f "setup.py" ]; then
            pip install -e .
          else
            echo "No installable package, skipping editable install"
          fi

      - name: Run tests with coverage
        working-directory: ${{ matrix.package }}
        run: |
          pkg_name=$(basename "${{ matrix.package }}")
          pytest -v --cov="$pkg_name" --cov-report=xml --cov-report=term || echo "No tests found, exiting with code 0"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          directory: ${{ matrix.package }}
          flags: python-${{ matrix.package }}
          name: python-${{ matrix.package }}-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true