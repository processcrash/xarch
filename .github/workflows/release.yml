name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build all artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Backend Java -----
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/gradle-wrapper.properties', 'backend/**/*.gradle*') }}

      - name: Build backend
        working-directory: backend
        run: chmod +x ./gradlew && ./gradlew clean build -x test --no-daemon

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: backend/**/build/libs/*.jar
          retention-days: 30
          if-no-files-found: ignore

      # ----- Vue Frontend -----
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vue3-admin/package-lock.json

      - name: Install frontend deps
        working-directory: vue3-admin
        run: npm ci

      - name: Build frontend
        working-directory: vue3-admin
        run: npm run build

      - name: Tar frontend dist
        run: |
          tar -czf frontend-dist.tar.gz -C vue3-admin dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-tar
          path: frontend-dist.tar.gz
          retention-days: 30
          if-no-files-found: error

      # ----- Python packages (sdist/wheel) -----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build Python packages
        run: |
          mkdir -p python-dist
          for dir in py-mcp-servers/* python/*; do
            if [ -d "$dir" ] && [ -f "$dir/pyproject.toml" -o -f "$dir/setup.py" ]; then
              cd "$dir"
              python -m build --outdir "../../python-dist/$(basename $dir)" || true
              cd - >/dev/null
            fi
          done

      - name: Upload Python artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python-dist/
          retention-days: 30
          if-no-files-found: ignore

      # ----- Node MCP packages -----
      - name: Set up Node for MCP
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Node MCP packages
        run: |
          for dir in node-mcp-servers/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              cd "$dir"
              npm ci
              npm run build || true
              cd - >/dev/null
            fi
          done

      - name: Upload Node MCP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-mcp-dist
          path: node-mcp-servers/
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show release assets
        run: |
          ls -laR release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/**/*
          fail_on_unmatched_files: false
          body: |
            ## ${{ github.ref_name }}

            ${{ github.event.head_commit.message }}

            ### Artifacts
            - Java JARs (xarch-example, gateways, MCP servers)
            - Frontend dist tarball (Vue 3 + TypeScript)
            - Python package distributions (sdist + wheel)
            - Node.js MCP server builds

            ### Installation

            See the project README for installation instructions.

            ### Checksums

            SHA256 checksums for all attached artifacts are included.

      - name: Generate changelog from PRs
        if: steps.release.outputs.id != ''
        run: |
          echo "Generating PR-based changelog..."
          gh pr list --state merged --base main --limit 50 --json number,title,author,mergedAt \
            --jq '.[] | "- #\(.number) - \(.title) (@\(.author.login))"' \
            > /tmp/pr-changelog.md
          cat /tmp/pr-changelog.md