name: 🐛 Bug Report
description: Report a bug to help us improve xarch
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! 🐛
        Please fill in the template below so we can reproduce and fix the issue quickly.
        If this is a **security vulnerability**, do NOT file a public issue — email security@xarch.example instead (see SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I run xarch with X config, the Y endpoint returns Z instead of W.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What you expected to see.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list, minimal repro. Include code/config snippets.
      placeholder: |
        1. Run `docker compose up -d`
        2. Open http://localhost:8080
        3. Click "..." button
        4. See error
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of xarch has the issue?
      options:
        - xarch-core-starter
        - xarch-db-starter
        - xarch-web-starter
        - xarch-cache-starter
        - xarch-tracing-starter
        - xarch-resilience-starter
        - xarch-storage-starter
        - xarch-mcp-database
        - xarch-mcp-knowledge
        - xarch-mcp-filesystem
        - xarch-mcp-vector
        - xarch-cloud-gateway
        - xarch-cloud-nacos
        - xarch-example (monolith)
        - xarch-example-micro (split)
        - vue3-admin
        - Helm chart / Kustomize
        - Documentation
        - Other (describe in comments)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: xarch version
      description: Git commit SHA, docker image tag, or `git describe` output.
      placeholder: "v1.0.0 or abc1234 or ghcr.io/processcrash/xarch-example:1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java / Node / Python version, OS, K8s version (if applicable), DB type.
      placeholder: |
        Java: OpenJDK 25.0.1
        OS: macOS 15.3
        Node: 20.10.0 (for vue3-admin)
        DB: PostgreSQL 16.4
        K8s: 1.30 (if used)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste relevant logs (use a code block). Mark any sensitive data first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: Drag-and-drop images into the editor after submitting, or paste a URL.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Self-check
      description: Confirm the following before submitting.
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am running the latest release of xarch (or main branch)
          required: true
        - label: This is a concrete, reproducible bug — not a question or feature request
          required: true
        - label: I have removed all sensitive data from the report
          required: true

  - type: markdown
    attributes:
      value: |
        **Triage process:** A maintainer will respond within **3 business days** with one of:
        - `status: confirmed` + label `priority: P0/P1/P2`
        - `status: needs-info` — please respond to our questions
        - `status: wontfix` + explanation
        - Duplicated and closed with a link to the original

        Please **do not** open a PR until the issue is labeled `status: ready-for-pr`.
