# Grafana Dashboard Provisioning
# Automatically provisions pre-configured dashboards

apiVersion: 1

providers:
  - name: 'xarch'
    orgId: 1
    folder: 'xarch'
    folderUid: 'xarch'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true