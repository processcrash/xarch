# Grafana Datasource Provisioning
# Automatically configures Loki and Prometheus as datasources

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    uid: loki
    jsonData:
      httpMethod: POST
      timeout: 60

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s