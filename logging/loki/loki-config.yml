# Loki Configuration for Docker and Kubernetes
# Loki is the log aggregation system that works with Grafana and Alloy

# Loki server configuration
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Memberlist configuration (for distributed Loki)
memberlist:
  join_members:
    - loki:7946

# Distributor configuration
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

# Ingester configuration (handles log writes)
ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 1
    heartbeat_period: 5s
    interface_names:
      - eth0

  # Chunk optimization
  chunk_target_size: 1572864  # 1.5MB
  max_chunk_age: 2h
  block_duration: 1h

# Storage configuration
storage_config:
  # Local filesystem storage (for development/small deployments)
  boltdb:
    directory: /tmp/loki/index

  # S3 storage (for production)
  aws:
    bucketnames: xarch-logs
    region: us-east-1
    # endpoint: https://s3.amazonaws.com  # For MinIO or other S3-compatible
    # s3forcepathstyle: true

  # Cassandra/BigTable (for large scale)
  # bigtable:

# Schema configuration
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb
      object_store: aws
      schema: v13
      index:
        prefix: loki_index_
        period: 168h  # 7 days

# Query configuration
query_range:
  # Parallelize queries
  parallelise_shardable_queries: true
  # Cache configuration
  cache_results: true
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        size: 1024
        validity: 1h

# Limits configuration
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100

# Compactor configuration (for retention)
compactor:
  working_directory: /tmp/loki/compactor
  delete_request_store: boltdb
  retention_enabled: true
  retention_delete_delay: 2h

# Ruler configuration (for alerts)
ruler:
  enable_api: true
  storage:
    type: local
    local:
      directory: /tmp/loki/rules
  rule_path: /tmp/loki/rules
  alert_timeout: 10s
  evaluation_timeout: 5s