version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xarch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xarch
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - xarch-network

  redis:
    image: redis:7-alpine
    container_name: xarch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - xarch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xarch-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xarch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - xarch-network

  frontend:
    build:
      context: ./vue3-admin
      dockerfile: Dockerfile
    container_name: xarch-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xarch-network

volumes:
  mysql-data:
  redis-data:

networks:
  xarch-network:
    driver: bridge