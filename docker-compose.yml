version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xarch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: xarch
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/db/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - xarch-network

  redis:
    image: redis:7-alpine
    container_name: xarch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - xarch-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: xarch-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: xarch
      RABBITMQ_DEFAULT_PASS: xarch
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - xarch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xarch-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xarch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: xarch
      SPRING_RABBITMQ_PASSWORD: xarch
      SPRING_RABBITMQ_VIRTUAL_HOST: /
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - xarch-network

  frontend:
    build:
      context: ./vue3-admin
      dockerfile: Dockerfile
    container_name: xarch-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xarch-network

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:

networks:
  xarch-network:
    driver: bridge