plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':xarch-spring-boot-starter:xarch-core-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-db-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-web-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-cache-spring-boot-starter')

    // MyBatis-Flex
    implementation 'com.mybatisflex:mybatisflex-spring-boot-starter:1.9.7'

    // JSON support for the tags column and analytics payload
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

springBoot {
    mainClass = 'com.xarch.crm.CrmApplication'
}
