plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

bootJar {
    archiveFileName = 'xarch-cloud-admin-server.jar'
}

dependencies {
    // Spring Boot Admin Server
    implementation 'de.codecentric:boot-admin-server:2.12.2'
    implementation 'de.codecentric:boot-admin-server-ui:2.12.2'
    implementation 'de.codecentric:boot-admin-server-ui-vue:2.12.2'

    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Cloud Nacos Discovery
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery:2023.0.3.2'

    // Spring Security (optional)
    // implementation 'org.springframework.boot:spring-boot-starter-security'

    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2024.0.0.0'
        mavenBom 'com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.3.2'
    }
}