# xarch Admin Server Configuration
server:
  port: 8090

spring:
  application:
    name: xarch-admin-server

  # Spring Boot Admin Server Configuration
  boot:
    admin:
      ui:
        title: xarch Services Monitor
        brand: <img src="assets/img/icon-spring-boot-admin.svg" class="logo"/>xarch Admin
        # Enable Vue-based UI
        vue:
          enabled: true
      # Instance discovery settings
      discovery:
        # Ignore self-registration
        ignore-services: ${spring.application.name}
      # Instance metadata
      instance:
        metadata:
          startup-time: ${START_TIME:${spring.application.name}: Platon}}
          version: ${info.app.version:1.0.0}

  # Cloud Discovery (Nacos integration)
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:xarch-cloud}
        group: DEFAULT_GROUP
        # Auto-register with Nacos
        register: true
        instance-id: ${spring.application.name}:${server.port}

# Management endpoints configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, logfile, heapdump, threaddump
  endpoint:
    health:
      show-details: when_authorized
    logfile:
      enabled: true
      external-file: logs/${spring.application.name}.log
  health:
    probes:
      enabled: true
  # Actuator info for Spring Boot Admin
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true

# Spring Security (optional - for authentication)
# security:
#   user:
#     name: admin
#     password: admin123

# Logging configuration
logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    de.codecentric.boot.admin: DEBUG
    org.springframework.cloud: INFO
    com.xarch: DEBUG