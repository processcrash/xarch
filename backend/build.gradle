// Top-level build file for xarch
plugins {
    id 'org.springframework.boot' version '4.0.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.xarch'
    version = '1.0.0'

    repositories {
        mavenLocal()
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = uri("https://maven.aliyun.com/repository/spring") }
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.3.5'
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
        }
        dependencies {
            dependency 'org.projectlombok:lombok:1.18.38'
            dependency 'org.slf4j:slf4j-api:2.0.16'
            dependency 'jakarta.validation:jakarta.validation-api:3.0.2'
            dependency 'io.swagger.core.v3:swagger-annotations:2.2.22'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
            dependency 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery:3.2.0'
            dependency 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config:3.2.0'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}