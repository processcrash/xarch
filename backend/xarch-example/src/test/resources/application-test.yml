# Test Configuration
spring:
  application:
    name: xarch-example-test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6379

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa:
  token:
    timeout: 86400
    active-timeout: -1
  token-name: Authorization
  token-prefix: Bearer

# Disable actuator in tests
management:
  endpoints:
    enabled-by-default: false
