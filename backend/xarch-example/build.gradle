plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':xarch-spring-boot-starter:xarch-core-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-db-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-web-spring-boot-starter')
    implementation project(':xarch-spring-boot-starter:xarch-cache-spring-boot-starter')

    // Excel import/export
    implementation 'com.alibaba:easyexcel:3.3.3'

    // Spring AI for LLM-based command generation
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter:1.0.0-M6'
    implementation 'org.springframework.ai:spring-ai-anthropic-spring-boot-starter:1.0.0-M6'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Actuator + Prometheus monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

springBoot {
    mainClass = 'com.xarch.example.XarchExampleApplication'
}