version: '3.8'

# xarch-example-micro docker-compose
# Brings up Nacos + MySQL + Redis + all 6 micro-services on bridge network "xarch-net".
#
# Usage:
#   ./build-images.sh                         # build all 6 service images
#   docker compose up -d nacos mysql redis    # infra only
#   docker compose up -d                      # everything
#
# Notes:
#   * Each service has its own Dockerfile under service-<name>/.
#   * Build context is the xarch-example-micro/ root (so :common resolves).
#   * Services depend on infra healthchecks (curl /actuator/health).
#   * The MySQL schema is created on first run from docs/db/init.sql (mounted).

networks:
  xarch-net:
    driver: bridge

volumes:
  nacos-data:
  mysql-data:
  redis-data:

services:
  # ------------------------------------------------------------------
  # Infrastructure
  # ------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: xarch-nacos
    networks: [xarch-net]
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mysql:
    image: mysql:8.4.0
    container_name: xarch-mysql
    networks: [xarch-net]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xarch
      MYSQL_USER: xarch
      MYSQL_PASSWORD: xarch
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: xarch-redis
    networks: [xarch-net]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Micro-services
  #
  # Image naming: xarch-example-micro/service-<name>:1.0.0
  # Build context: .   (the xarch-example-micro/ root — same level as
  #                   service-auth/, common/, settings.gradle, etc.)
  # ------------------------------------------------------------------
  service-auth:
    build:
      context: .
      dockerfile: service-auth/Dockerfile
    image: xarch-example-micro/service-auth:1.0.0
    container_name: xarch-service-auth
    networks: [xarch-net]
    ports:
      - "9001:9001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9001/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  service-system:
    build:
      context: .
      dockerfile: service-system/Dockerfile
    image: xarch-example-micro/service-system:1.0.0
    container_name: xarch-service-system
    networks: [xarch-net]
    ports:
      - "9002:9002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  service-file:
    build:
      context: .
      dockerfile: service-file/Dockerfile
    image: xarch-example-micro/service-file:1.0.0
    container_name: xarch-service-file
    networks: [xarch-net]
    ports:
      - "9003:9003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9003/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  service-monitor:
    build:
      context: .
      dockerfile: service-monitor/Dockerfile
    image: xarch-example-micro/service-monitor:1.0.0
    container_name: xarch-service-monitor
    networks: [xarch-net]
    ports:
      - "9004:9004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9004/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  service-ai:
    build:
      context: .
      dockerfile: service-ai/Dockerfile
    image: xarch-example-micro/service-ai:1.0.0
    container_name: xarch-service-ai
    networks: [xarch-net]
    ports:
      - "9005:9005"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9005/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  service-message:
    build:
      context: .
      dockerfile: service-message/Dockerfile
    image: xarch-example-micro/service-message:1.0.0
    container_name: xarch-service-message
    networks: [xarch-net]
    ports:
      - "9006:9006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: nacos:8848
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9006/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped
