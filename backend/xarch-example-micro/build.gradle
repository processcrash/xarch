// Top-level build file for xarch-example-micro
// Multi-module Gradle project that decomposes xarch-example monolith
// into 6 Spring Cloud micro-services.

plugins {
    id 'org.springframework.boot' version '3.4.0' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.xarch.example'
    version = '1.0.0'

    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/spring' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.4.0'
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
            mavenBom 'com.alibaba.cloud:spring-cloud-alibaba-dependencies:2023.0.1.0'
        }
        dependencies {
            dependency 'org.projectlombok:lombok:1.18.38'
            dependency 'org.slf4j:slf4j-api:2.0.16'
            dependency 'jakarta.validation:jakarta.validation-api:3.0.2'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}