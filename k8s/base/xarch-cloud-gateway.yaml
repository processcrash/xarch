# ===============================================
# Spring Cloud Gateway 部署配置
# ===============================================
# API 网关，作为所有服务的统一入口
# 路由规则：
#   /api/* -> xarch-example (业务服务)
#   /mcp/* -> MCP Servers (MCP 服务)
# 端口：8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xarch-cloud-gateway
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-cloud-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xarch-cloud-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xarch-cloud-gateway
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: xarch-sa
      initContainers:
        - name: wait-for-nacos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Nacos to be ready..."
              until curl -sf http://nacos.xarch:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready, waiting..."
                sleep 5
              done
              echo "Nacos is ready!"
      containers:
        - name: xarch-cloud-gateway
          image: xarch/xarch-cloud-gateway:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_NAME
              value: "xarch-cloud-gateway"
            - name: SERVER_PORT
              value: "8080"
            # Nacos 服务发现
            - name: SPRING_CLOUD_NAcOS_SERVER_ADDR
              value: "nacos.xarch:8848"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_NAMESPACE
              value: "xarch-cloud"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_GROUP
              value: "DEFAULT_GROUP"
            # 路由配置（通过 Nacos 配置中心管理）
            - name: SPRING_CLOUD_GATEWAY_ROUTES
              value: |
                - id: system-user
                  uri: lb://xarch-example
                  predicates:
                    - Path=/api/system/user/**
                - id: mcp-database
                  uri: lb://xarch-mcp-database
                  predicates:
                    - Path=/mcp/database/**
            # 全局超时配置
            - name: SPRING_CLOUD_GATEWAY_GLOBALBODY_TIMEOUT
              value: "30s"
            # JVM 参数
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
---
# ===============================================
# Gateway Service 配置
# ===============================================
# 使用 LoadBalancer 类型，通过 Ingress 对外暴露
apiVersion: v1
kind: Service
metadata:
  name: xarch-cloud-gateway
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-cloud-gateway
    app.kubernetes.io/component: api-gateway
  annotations:
    description: "Spring Cloud Gateway - API Entry Point"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: xarch-cloud-gateway