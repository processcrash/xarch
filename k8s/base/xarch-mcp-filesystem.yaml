# ===============================================
# Filesystem MCP Server 部署配置
# ===============================================
# 企业级文件系统 MCP Server，支持安全的文件操作
# 提供工具：list_directory、read_file、write_file、delete、search_files、get_file_info、copy_file、move_file
# 端口：9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xarch-mcp-filesystem
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-mcp-filesystem
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xarch-mcp-filesystem
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xarch-mcp-filesystem
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: xarch-sa
      initContainers:
        - name: wait-for-nacos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Nacos to be ready..."
              until curl -sf http://nacos.xarch:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready, waiting..."
                sleep 5
              done
              echo "Nacos is ready!"
      containers:
        - name: xarch-mcp-filesystem
          image: xarch/xarch-mcp-filesystem:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9092
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_NAME
              value: "xarch-mcp-filesystem"
            - name: SERVER_PORT
              value: "9092"
            # Nacos MCP 服务注册
            - name: SPRING_CLOUD_NAcOS_SERVER_ADDR
              value: "nacos.xarch:8848"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_NAMESPACE
              value: "xarch-cloud"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_GROUP
              value: "MCP"
            # MCP Server 类型标识
            - name: XARCH_MCP_TYPE
              value: "filesystem"
            # 允许访问的根目录（安全隔离）
            - name: XARCH_ALLOWED_BASE_PATH
              value: "/data/files"
            # 允许的文件扩展名（安全防护）
            - name: XARCH_ALLOWED_EXTENSIONS
              value: ".txt,.md,.json,.yaml,.yml,.xml,.csv,.log"
            # JVM 参数
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC"
          readinessProbe:
            httpGet:
              path: /mcp/filesystem/health
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /mcp/filesystem/health
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # 文件存储卷
          volumeMounts:
            - name: filesystem-data
              mountPath: /data/files
      volumes:
        - name: filesystem-data
          emptyDir: {}  # 生产环境使用 PVC 或 NFS
---
apiVersion: v1
kind: Service
metadata:
  name: xarch-mcp-filesystem
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-mcp-filesystem
    app.kubernetes.io/component: mcp-server
  annotations:
    description: "Filesystem MCP Server - Secure File Operations"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9092
      targetPort: 9092
      protocol: TCP
  selector:
    app.kubernetes.io/name: xarch-mcp-filesystem