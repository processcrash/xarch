# ===============================================
# xarch-example 业务应用部署配置
# ===============================================
# 业务应用主服务，包含用户、角色、菜单、部门等管理功能
# 端口说明：
#   - 8080: HTTP API 端口
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xarch-example
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-example
    app.kubernetes.io/component: application
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2  # 生产环境建议至少 2 个副本
  selector:
    matchLabels:
      app.kubernetes.io/name: xarch-example
  # 滚动更新策略：先增加新 Pod，再减少旧 Pod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xarch-example
        app.kubernetes.io/component: application
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: xarch-sa
      # 初始化容器：等待 Nacos 就绪后再启动应用
      initContainers:
        - name: wait-for-nacos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Nacos to be ready..."
              until curl -sf http://nacos.xarch:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready, waiting..."
                sleep 5
              done
              echo "Nacos is ready!"
      containers:
        - name: xarch-example
          # 镜像地址（需替换为实际镜像仓库）
          image: xarch/xarch-example:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 应用配置
            - name: SPRING_APPLICATION_NAME
              value: "xarch-example"
            - name: SERVER_PORT
              value: "8080"
            # Nacos 配置中心
            - name: SPRING_CLOUD_NAcOS_SERVER_ADDR
              value: "nacos.xarch:8848"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_NAMESPACE
              value: "xarch-cloud"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_GROUP
              value: "DEFAULT_GROUP"
            - name: SPRING_CLOUD_NAcOS_CONFIG_NAMESPACE
              value: "xarch-cloud"
            - name: SPRING_CLOUD_NAcOS_CONFIG_GROUP
              value: "DEFAULT_GROUP"
            # 数据源配置（引用 Secret）
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.xarch:3306/xarch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xarch-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xarch-secrets
                  key: DB_PASSWORD
            # Redis 配置
            - name: SPRING_REDIS_HOST
              value: "redis.xarch"
            - name: SPRING_REDIS_PORT
              value: "6379"
            # Sa-Token 配置（无状态认证）
            - name: SA_TOKEN_TIMEOUT
              value: "7200"
            # JVM 参数
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
          # 健康检查
          readinessProbe:
            httpGet:
              path: /api/auth/captcha
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/auth/captcha
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # 资源限制
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          # 生命周期钩子：优雅关闭
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 10"
---
# ===============================================
# xarch-example Service 配置
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: xarch-example
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-example
    app.kubernetes.io/component: application
  annotations:
    description: "xarch Example Application Service"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: xarch-example