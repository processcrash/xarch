# ===============================================
# Knowledge Base MCP Server 部署配置
# ===============================================
# 企业级知识库 MCP Server，支持 RAG 语义搜索
# 提供工具：kb_index_document、kb_search、kb_get_document、kb_delete、kb_list
# 端口：9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xarch-mcp-knowledge
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-mcp-knowledge
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xarch-mcp-knowledge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xarch-mcp-knowledge
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: xarch-sa
      initContainers:
        - name: wait-for-nacos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Nacos to be ready..."
              until curl -sf http://nacos.xarch:8848/nacos/v1/console/health/readiness; do
                echo "Nacos is not ready, waiting..."
                sleep 5
              done
              echo "Nacos is ready!"
      containers:
        - name: xarch-mcp-knowledge
          image: xarch/xarch-mcp-knowledge:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_NAME
              value: "xarch-mcp-knowledge"
            - name: SERVER_PORT
              value: "9091"
            # Nacos MCP 服务注册
            - name: SPRING_CLOUD_NAcOS_SERVER_ADDR
              value: "nacos.xarch:8848"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_NAMESPACE
              value: "xarch-cloud"
            - name: SPRING_CLOUD_NAcOS_DISCOVERY_GROUP
              value: "MCP"
            # MCP Server 类型标识
            - name: XARCH_MCP_TYPE
              value: "knowledge-base"
            # 向量嵌入维度（用于语义搜索）
            - name: XARCH_VECTOR_DIMENSION
              value: "1536"
            # 最大文档数量
            - name: XARCH_MAX_DOCUMENTS
              value: "100000"
            # JVM 参数
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC"
          readinessProbe:
            httpGet:
              path: /mcp/knowledge/health
              port: 9091
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /mcp/knowledge/health
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          # 知识库数据持久化（生产环境建议使用 PVC）
          volumeMounts:
            - name: knowledge-data
              mountPath: /data/knowledge
      volumes:
        - name: knowledge-data
          emptyDir: {}  # 生产环境使用 PVC
---
apiVersion: v1
kind: Service
metadata:
  name: xarch-mcp-knowledge
  namespace: xarch
  labels:
    app.kubernetes.io/name: xarch-mcp-knowledge
    app.kubernetes.io/component: mcp-server
  annotations:
    description: "Knowledge Base MCP Server - RAG Semantic Search"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP
  selector:
    app.kubernetes.io/name: xarch-mcp-knowledge