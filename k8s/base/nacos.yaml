# ===============================================
# Nacos 3.2 部署配置
# ===============================================
# Nacos 是 xarch 的服务注册中心和配置中心
# 端口说明：
#   - 8848: 主端口（HTTP API）
#   - 9848: gRPC 端口（客户端通信）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: service-registry
    app.kubernetes.io/version: "3.2.0"
spec:
  # Nacos 支持水平扩展但需要使用嵌入式存储时建议单实例
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/component: service-registry
        app.kubernetes.io/version: "3.2.0"
    spec:
      # 使用专用 ServiceAccount
      serviceAccountName: xarch-sa
      # 亲和性配置：偏好调度到特定节点（可选）
      affinity:
        # 避免将 Nacos 所有副本调度到同一节点
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nacos
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nacos
          # 使用官方 Nacos Docker 镜像
          # 如需构建自定义镜像可在 overrides 中替换
          image: nacos/nacos-server:v2.2.3
          imagePullPolicy: IfNotPresent
          ports:
            # HTTP API 端口
            - name: http
              containerPort: 8848
              protocol: TCP
            # gRPC 端口用于服务发现
            - name: grpc
              containerPort: 9848
              protocol: TCP
          env:
            # 单机模式启动（K8s 内部使用嵌入式数据库）
            # 生产环境建议使用外部 MySQL 存储
            - name: MODE
              value: "standalone"
            # Nacos 服务端点
            - name: NACOS_SERVER_PORT
              value: "8848"
            # JVM 参数优化
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "1024m"
            - name: JVM_XMN
              value: "256m"
            # 认证配置（可选，生产环境应启用）
            - name: NACOS_AUTH_ENABLE
              value: "false"
          # 健康检查
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nacos/v1/console/health/liveness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 资源限制
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            # Nacos 数据存储（如需持久化）
            - name: nacos-data
              mountPath: /home/nacos/data
      volumes:
        - name: nacos-data
          emptyDir:
            {}  # 生产环境建议使用 PVC
---
# ===============================================
# Nacos Service 配置
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: service-registry
  annotations:
    # 服务说明
    description: "Nacos Service Registry and Config Center"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
  selector:
    app.kubernetes.io/name: nacos