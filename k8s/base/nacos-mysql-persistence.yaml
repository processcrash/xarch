# ===============================================
# Nacos 3.2 外部 MySQL 持久化配置
# ===============================================
# 此配置将 Nacos 数据存储从嵌入式数据库迁移到外部 MySQL
# 确保生产环境数据可靠性
# ===============================================

---
# Nacos MySQL 配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-mysql-config
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: config-mysql
data:
  # MySQL 数据库名称
  MYSQL_DB_NAME: "nacos"
  # MySQL 服务地址（需要根据实际环境修改）
  MYSQL_SERVICE: "mysql"
  # MySQL 服务端口
  MYSQL_PORT: "3306"
  # MySQL 用户名
  MYSQL_USER: "nacos"
  # MySQL 密码（生产环境应使用 Secret）
  MYSQL_PASSWORD: "nacos123"
---
# ===============================================
# Nacos 部署配置（MySQL 持久化模式）
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: service-registry
    app.kubernetes.io/version: "3.2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/component: service-registry
        app.kubernetes.io/version: "3.2.0"
    spec:
      serviceAccountName: xarch-sa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nacos
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8848
              protocol: TCP
            - name: grpc
              containerPort: 9848
              protocol: TCP
          env:
            # ========== MySQL 持久化配置 ==========
            # 使用 MySQL 作为存储后端
            - name: MODE
              value: "cluster"
            # 使用外部 MySQL
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            # MySQL 服务地址
            - name: MYSQL_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_SERVICE
            # MySQL 服务端口
            - name: MYSQL_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_PORT
            # MySQL 数据库名称
            - name: MYSQL_DATABASE_NUM
              value: "1"
            # 第一个数据库名称
            - name: NACOS_DATABASE_NACOS
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_DB_NAME
            # MySQL 用户名
            - name: NACOS_DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_USER
            # MySQL 密码
            - name: NACOS_DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_PASSWORD
            # ========== 其他配置 ==========
            - name: NACOS_SERVER_PORT
              value: "8848"
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "1024m"
            - name: JVM_XMN
              value: "256m"
            # 启用认证（生产环境建议启用）
            - name: NACOS_AUTH_ENABLE
              value: "false"
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nacos/v1/console/health/liveness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
      volumes:
        - name: nacos-data
          emptyDir: {}
---
# MySQL Nacos 数据库初始化 Job（仅首次部署时运行）
apiVersion: batch/v1
kind: Job
metadata:
  name: nacos-mysql-init
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: mysql-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/component: mysql-init
    spec:
      serviceAccountName: xarch-sa
      restartPolicy: OnFailure
      containers:
        - name: mysql-client
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              # 创建 Nacos 数据库和用户
              mysql -h ${MYSQL_SERVICE} -P ${MYSQL_PORT} -u root -p${MYSQL_ROOT_PASSWORD} <<-EOSQL
              CREATE DATABASE IF NOT EXISTS nacos CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS 'nacos'@'%' IDENTIFIED BY 'nacos123';
              GRANT ALL PRIVILEGES ON nacos.* TO 'nacos'@'%';
              FLUSH PRIVILEGES;
              EOSQL
          env:
            - name: MYSQL_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_SERVICE
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: nacos-mysql-config
                  key: MYSQL_PORT
            - name: MYSQL_ROOT_PASSWORD
              value: "root123"
---
# Nacos Service
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: xarch
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/component: service-registry
  annotations:
    description: "Nacos Service Registry and Config Center with MySQL"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
  selector:
    app.kubernetes.io/name: nacos
