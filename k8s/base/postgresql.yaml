# ===============================================
# PostgreSQL 数据库部署配置
# ===============================================
# xarch 项目的默认数据库（从 MySQL 迁移）
# 端口：5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: xarch
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "16"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  strategy:
    type: Recreate  # PostgreSQL 不支持同时运行多个实例
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "16"
    spec:
      serviceAccountName: xarch-sa
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # 数据库初始化配置
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: xarch-secrets
                  key: DB_USERNAME
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xarch-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "xarch"
            # 时区配置
            - name: TZ
              value: "Asia/Shanghai"
            # PostgreSQL 配置
            - name: POSTGRES_INITDB_ARGS
              value: "-E UTF8 --encoding=UTF8 --locale=C"
          # 数据持久化
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # 健康检查
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        # 数据持久化卷（生产环境建议使用 StorageClass）
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
---
# ===============================================
# PostgreSQL Service 配置
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: xarch
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
  annotations:
    description: "PostgreSQL Database for xarch"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql
---
# ===============================================
# PostgreSQL PVC 配置
# ===============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: xarch
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  # 根据实际 StorageClass 调整
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi  # 根据数据量调整