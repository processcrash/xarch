# ConfigMaps for Observability Stack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: xarch-observability
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    memberlist:
      join_members:
        - loki:7946
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 1
        heartbeat_period: 5s
    storage_config:
      boltdb:
        directory: /tmp/loki/index
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb
          object_store: boltdb
          schema: v13
          index:
            prefix: loki_index_
            period: 168h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: xarch-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'xarch-services'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: xarch.*
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: xarch-observability
data:
  config.alloy: |
    // Alloy config for Kubernetes log collection
    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.process "kubernetes" {
      stage.docker { }
      stage.labels {
        keep = ["app", "namespace"]
      }
      forward_to = [loki.write.loki]
    }

    loki.write "loki" {
      endpoint = "http://loki:3100/loki/api/v1/push"
      external_labels = {
        cluster = "xarch-k8s",
        environment = "kubernetes"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: xarch-observability
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki:3100
        uid: loki
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        uid: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: xarch-observability
data:
  xarch-services.json: |
    {"annotations":{"list":[]},"editable":true,"fiscalYearStartMonth":0,"graphTooltip":1,"id":null,"links":[],"liveNow":false,"panels":[{"datasource":{"type":"prometheus","uid":"prometheus"},"fieldConfig":{"defaults":{"color":{"mode":"palette-classic"},"mappings":[],"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null}]},"unit":"percent"}},"gridPos":{"h":8,"w":12,"x":0,"y":0},"id":1,"options":{"orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showThresholdLabels":false,"showThresholdMarkers":true},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{name=~\".*xarch.*\"}[5m]))","legendFormat":"CPU"}],"title":"CPU Usage","type":"gauge"}],"refresh":"10s","schemaVersion":40,"tags":["xarch"],"templating":{"list":[]},"time":{"from":"now-1h","to":"now"},"timepicker":{},"timezone":"browser","title":"xarch Services","uid":"xarch","version":1}