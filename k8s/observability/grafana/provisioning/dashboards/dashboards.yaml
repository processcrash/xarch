# =============================================================================
# Grafana dashboard provider
# Loads dashboards mounted at /var/lib/grafana/dashboards inside the pod
# =============================================================================
apiVersion: 1

providers:
  - name: xarch-dashboards
    orgId: 1
    folder: xarch
    folderUid: xarch
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
