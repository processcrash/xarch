# =============================================================================
# Grafana datasource provisioning
# Auto-mounts Prometheus so Grafana is ready to query on startup.
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: High
      incrementalQuerying: true
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
      # Default alertmanager datasource URL for unified alert routing
      alertmanagerUid: alertmanager
    secureJsonData: {}
