# =============================================================================
# Grafana notification policies
# Root policy "xarch" groups alerts by name+severity+service so duplicates
# are coalesced before being sent to the xarch-team contact point.
# =============================================================================
apiVersion: 1

policies:
  - orgId: 1
    receiver: xarch-team
    group_by:
      - alertname
      - severity
      - service
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    active_time_intervals: []
    routes:
      - object_matchers:
          - ["severity", "=", "critical"]
        receiver: xarch-team
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 30m
        continue: false
