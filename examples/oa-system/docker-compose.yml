version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: oa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: oa_system
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: oa-redis
    ports:
      - "6380:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: oa-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/oa_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ../../vue3-admin
      dockerfile: Dockerfile
    container_name: oa-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql-data: