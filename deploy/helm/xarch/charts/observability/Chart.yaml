apiVersion: v2
name: observability
description: |
  Lightweight in-cluster observability stack for xarch. Includes Prometheus
  for metrics, Grafana for dashboards, and an optional Alertmanager. For
  production at scale, install kube-prometheus-stack, Loki, and Tempo via
  their official Helm charts instead and set .Values.observability.enabled=false.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - xarch
  - observability
  - prometheus
  - grafana
maintainers:
  - name: processcrash
    url: https://github.com/processcrash
