prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.54.1
  retention: 15d
  storageSize: 50Gi
  storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.2.0"
  adminPassword: changeme
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: false

service:
  prometheusPort: 9090
  grafanaPort: 3000
