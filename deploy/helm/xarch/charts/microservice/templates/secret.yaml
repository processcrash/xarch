{{- if and .Values.enabled .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservice.fullname" . }}-secret
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
