{{- if and .Values.enabled .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "microservice.fullname" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from anywhere in the same namespace.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | default "xarch" }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
    # Allow Prometheus scraping.
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Nacos
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8848
          protocol: TCP
        - port: 9848
          protocol: TCP
    # MySQL
    - to:
        - namespaceSelector: {}
      ports:
        - port: 3306
          protocol: TCP
    # Redis
    - to:
        - namespaceSelector: {}
      ports:
        - port: 6379
          protocol: TCP
{{- end }}
