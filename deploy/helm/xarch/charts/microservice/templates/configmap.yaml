{{- if and .Values.enabled .Values.configmap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.fullname" . }}-config
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.configmap.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
