# Default values for the gateway sub-chart.
name: ""
replicaCount: 2
port: 8080

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
containerSecurityContext: {}

env: []
envFrom: []

resources: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

probes:
  liveness:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  path: /actuator/prometheus

# Routes rendered into a ConfigMap mounted as SPRING_CLOUD_GATEWAY_ROUTES
# when .Values.routesConfigMap.enabled is true. In production, the gateway
# loads its route definitions from Nacos instead.
routesConfigMap:
  enabled: false
  routes: []
  # - id: service-system
  #   uri: lb://service-system
  #   predicates:
  #     - Path=/api/system/**

nodeSelector: {}
tolerations: []
affinity: {}
