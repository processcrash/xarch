{{- /*
NOTE: This Secret is only rendered when .Values.auth.bootstrapSecret is true
and is intended for development use only. In production, the Secret must be
provisioned by an external operator (Sealed Secrets, External Secrets Operator,
Vault, etc.) so that the password never lands in the chart values.
*/ -}}
{{- if .Values.auth.bootstrapSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.secretName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ .Values.auth.rootPassword | default "" | b64enc | quote }}
  mysql-password: {{ .Values.auth.password | default "" | b64enc | quote }}
{{- end }}
